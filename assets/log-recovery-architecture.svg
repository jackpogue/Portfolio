<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Parallel WAF log recovery architecture</title>
  <desc id="desc">Edge log sources feed restored raw data into S3. AWS Batch fans the work out across parallel workers, which normalize and merge the files before validation and replay through the existing log pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#10232d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#62c9d9"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1120" height="440" rx="18" fill="url(#bg)"/>
  <text x="54" y="46" fill="#62c9d9" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">SIMPLIFIED RECOVERY FLOW</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(46 126)"><rect width="152" height="176" rx="12" fill="#132f3c" stroke="#3d6574"/><text x="76" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Edge logs</text><text x="76" y="73" text-anchor="middle" fill="#b8c9d0" font-size="13">POP sources</text><path d="M38 112h76M38 132h76M38 152h50" stroke="#d88b37" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(256 126)"><rect width="162" height="176" rx="12" fill="#fff"/><text x="81" y="45" text-anchor="middle" fill="#0b0f14" font-size="18" font-weight="700">Raw restore</text><text x="81" y="73" text-anchor="middle" fill="#52626b" font-size="13">Amazon S3</text><path d="M45 108c0-18 72-18 72 0v44c0 18-72 18-72 0z" fill="#d88b37"/><ellipse cx="81" cy="108" rx="36" ry="12" fill="#f0ad61"/></g>
    <g transform="translate(474 76)"><rect width="246" height="278" rx="12" fill="#102a36" stroke="#62c9d9" stroke-width="2"/><text x="123" y="40" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">AWS Batch fan-out</text><text x="123" y="65" text-anchor="middle" fill="#9fc4cc" font-size="13">Parallel custom recovery tools</text><g fill="#1c4657" stroke="#62c9d9"><rect x="28" y="92" width="82" height="55" rx="7"/><rect x="136" y="92" width="82" height="55" rx="7"/><rect x="28" y="166" width="82" height="55" rx="7"/><rect x="136" y="166" width="82" height="55" rx="7"/></g><g fill="#fff" font-size="13" text-anchor="middle"><text x="69" y="125">worker 01</text><text x="177" y="125">worker 02</text><text x="69" y="199">worker 03</text><text x="177" y="199">worker …</text></g><text x="123" y="253" text-anchor="middle" fill="#d88b37" font-size="13" font-weight="700">NORMALIZE · DATE · MERGE</text></g>
    <g transform="translate(778 126)"><rect width="146" height="176" rx="12" fill="#fff"/><text x="73" y="45" text-anchor="middle" fill="#0b0f14" font-size="18" font-weight="700">Validate</text><text x="73" y="73" text-anchor="middle" fill="#52626b" font-size="13">Rebuild batches</text><path d="M45 119l18 18 39-45" fill="none" stroke="#197486" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(982 126)"><rect width="92" height="176" rx="12" fill="#173c4a" stroke="#3d6574"/><text x="46" y="45" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Replay</text><text x="46" y="71" text-anchor="middle" fill="#b8c9d0" font-size="12">existing</text><text x="46" y="89" text-anchor="middle" fill="#b8c9d0" font-size="12">pipeline</text><path d="M28 122h36M28 140h36" stroke="#62c9d9" stroke-width="7" stroke-linecap="round"/></g>
  </g>
  <g stroke="#62c9d9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M198 214h49"/><path d="M418 214h47"/><path d="M720 214h49"/><path d="M924 214h49"/></g>
  <g font-family="Arial,sans-serif" font-size="13" text-anchor="middle"><text x="337" y="336" fill="#62c9d9" font-weight="700">1.5+ TB</text><text x="337" y="355" fill="#9fb1b9">restored data</text><text x="597" y="390" fill="#62c9d9" font-weight="700">~6.5 MILLION FILES PROCESSED IN PARALLEL</text></g>
</svg>
