<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Representative Callgrind call graph</title><desc id="desc">A reconstructed call graph that traces an integration test from its main routine through a range read to block retrieval, cache lookup, and manifest validation, with inclusive execution times.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 3 0 6z" fill="#71858f"/></marker></defs>
  <rect width="1000" height="600" rx="18" fill="#0c141a"/><text x="54" y="52" fill="#fff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Representative Callgrind call graph</text><text x="54" y="82" fill="#9fb0b9" font-family="system-ui,sans-serif" font-size="15">Inclusive time shows where the test spent its time; arrows show the observed call path.</text>
  <g fill="none" stroke="#71858f" stroke-width="3" marker-end="url(#arrow)"><path d="M210 190H330"/><path d="M520 190H640"/><path d="M770 245V310H650V335"/><path d="M770 245V310H872V335"/><path d="M625 450V490"/></g>
  <g font-family="system-ui,sans-serif">
    <g><rect x="55" y="135" width="155" height="110" rx="10" fill="#153b4c" stroke="#62c9d9" stroke-width="2"/><text x="78" y="175" fill="#fff" font-size="18" font-weight="700">main</text><text x="78" y="207" fill="#8de1ec" font-size="28" font-weight="800">100%</text><text x="78" y="228" fill="#b9c7ce" font-size="12">integration test</text></g>
    <g><rect x="330" y="135" width="190" height="110" rx="10" fill="#153b4c" stroke="#62c9d9" stroke-width="2"/><text x="353" y="175" fill="#fff" font-size="18" font-weight="700">run_test</text><text x="353" y="207" fill="#8de1ec" font-size="28" font-weight="800">96.2%</text><text x="353" y="228" fill="#b9c7ce" font-size="12">YAML scenario runner</text></g>
    <g><rect x="640" y="135" width="260" height="110" rx="10" fill="#5d3520" stroke="#d88b37" stroke-width="2"/><text x="665" y="175" fill="#fff" font-size="18" font-weight="700">UG_read</text><text x="665" y="207" fill="#ffc27d" font-size="28" font-weight="800">81.7%</text><text x="665" y="228" fill="#e0c7b1" font-size="12">range-read path under investigation</text></g>
    <g><rect x="500" y="335" width="250" height="115" rx="10" fill="#17242c" stroke="#91a4af" stroke-width="2"/><text x="525" y="375" fill="#fff" font-size="18" font-weight="700">fetch_block</text><text x="525" y="407" fill="#d7e2e7" font-size="28" font-weight="800">68.4%</text><text x="525" y="430" fill="#aebdc5" font-size="12">remote block retrieval</text></g>
    <g><rect x="790" y="335" width="165" height="115" rx="10" fill="#17242c" stroke="#91a4af" stroke-width="2"/><text x="812" y="375" fill="#fff" font-size="17" font-weight="700">validate</text><text x="812" y="397" fill="#fff" font-size="17" font-weight="700">manifest</text><text x="812" y="427" fill="#d7e2e7" font-size="24" font-weight="800">12.1%</text></g>
    <g><rect x="500" y="490" width="250" height="70" rx="10" fill="#13212b" stroke="#4f6570"/><text x="525" y="520" fill="#fff" font-size="16" font-weight="700">cache_lookup</text><text x="525" y="544" fill="#aebdc5" font-size="16">18.3% · 14,208 calls</text></g>
  </g>
</svg>
